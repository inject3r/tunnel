name: Release Linux builds

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify source (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
            platform: linux/amd64
          - arch: aarch64
            runner: ubuntu-24.04-arm
            platform: linux/arm64
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build/test prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++ make nftables

      - name: Verify tag matches source version
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          set -euo pipefail
          tag_version="${GITHUB_REF_NAME#v}"
          cmake_version="$(sed -n 's/^project(tunnel VERSION \([^[:space:])]*\).*/\1/p' CMakeLists.txt | head -1)"
          source_version="$(sed -n 's/.*kVersion = "\([^"]*\)".*/\1/p' src/tunnel/config.h | head -1)"
          [[ -n "$cmake_version" && -n "$source_version" ]]
          [[ "$tag_version" == "$cmake_version" ]]
          [[ "$tag_version" == "$source_version" ]]
          echo "Release version verified: $tag_version"

      - name: Build with warnings as errors
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DTUNNEL_WERROR=ON
          cmake --build build --parallel

      - name: Run test suite
        shell: bash
        run: |
          set -euo pipefail
          ./tests/cli-smoke.sh ./build/tunnel
          ./tests/static-firewall-audit.sh
          ./tests/static-proxy-selection-audit.sh
          ./tests/static-recovery-audit.sh
          ./tests/nft-syntax.sh

      - name: Check ELF dependencies
        run: |
          file build/tunnel
          ldd build/tunnel || true
          readelf --version-info build/tunnel 2>/dev/null | grep -o 'GLIBC_[0-9.]*' | sort -Vu || true

  portable:
    name: Build portable glibc (${{ matrix.arch }})
    needs: verify
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
            platform: linux/amd64
          - arch: aarch64
            runner: ubuntu-24.04-arm
            platform: linux/arm64
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build from Debian 11 userland
        env:
          VERSION: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          version="${VERSION#v}"
          out="$RUNNER_TEMP/release"
          mkdir -p "$out"
          docker run --rm --platform '${{ matrix.platform }}' \
            -e VERSION="$version" \
            -v "$GITHUB_WORKSPACE:/src:ro" \
            -v "$out:/out" \
            debian:11-slim bash -euxo pipefail -c '
              rm -f /etc/apt/sources.list.d/debian.sources
              cat > /etc/apt/sources.list <<EOF
              deb http://archive.debian.org/debian bullseye main
              EOF
              apt-get -o Acquire::Check-Valid-Until=false update
              DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends cmake g++ make ca-certificates
              cd /src
              VERSION="$VERSION" packaging/release/build-tarball.sh "/out/tunnel-$VERSION-${{ matrix.arch }}-portable-glibc.tar.gz" portable-glibc
            '

      - name: Assert portable glibc ceiling
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          tmp="$RUNNER_TEMP/check"
          mkdir -p "$tmp"
          tar -xzf "$RUNNER_TEMP/release/tunnel-$version-${{ matrix.arch }}-portable-glibc.tar.gz" -C "$tmp"
          readelf --version-info "$tmp/usr/bin/tunnel" 2>/dev/null \
            | grep -o 'GLIBC_[0-9.]*' | sort -Vu > "$tmp/glibc.txt"
          cat "$tmp/glibc.txt"
          max="$(tail -1 "$tmp/glibc.txt")"
          [[ "$max" == "GLIBC_2.31" || "$max" == GLIBC_2.3[01] ]]

      - name: Upload portable artifact
        uses: actions/upload-artifact@v4
        with:
          name: portable-${{ matrix.arch }}
          path: ${{ runner.temp }}/release/*
          if-no-files-found: error
          retention-days: 7

  build:
    name: Build ${{ matrix.id }}
    needs: verify
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: debian-x86_64
            runner: ubuntu-24.04
            platform: linux/amd64
            image: debian:12-slim
            kind: deb
          - id: debian-aarch64
            runner: ubuntu-24.04-arm
            platform: linux/arm64
            image: debian:12-slim
            kind: deb
          - id: fedora-x86_64
            runner: ubuntu-24.04
            platform: linux/amd64
            image: fedora:latest
            kind: rpm
          - id: fedora-aarch64
            runner: ubuntu-24.04-arm
            platform: linux/arm64
            image: fedora:latest
            kind: rpm
          - id: arch-x86_64
            runner: ubuntu-24.04
            platform: linux/amd64
            image: archlinux:base
            kind: arch
          - id: arch-aarch64
            runner: ubuntu-24.04-arm
            platform: linux/arm64
            image: menci/archlinuxarm:base
            kind: arch
          - id: alpine-x86_64
            runner: ubuntu-24.04
            platform: linux/amd64
            image: alpine:latest
            kind: musl
          - id: alpine-aarch64
            runner: ubuntu-24.04-arm
            platform: linux/arm64
            image: alpine:latest
            kind: musl
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build distro artifact
        env:
          VERSION: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          version="${VERSION#v}"
          out="$RUNNER_TEMP/release"
          mkdir -p "$out"

          case '${{ matrix.kind }}' in
            deb)
              docker run --rm --platform '${{ matrix.platform }}' \
                -e VERSION="$version" \
                -v "$GITHUB_WORKSPACE:/src:ro" \
                -v "$out:/out" \
                '${{ matrix.image }}' bash -euxo pipefail -c '
                  apt-get update
                  DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends cmake g++ make dpkg-dev ca-certificates
                  cd /src
                  VERSION="$VERSION" packaging/debian/build-deb.sh "/out/tunnel-$VERSION-${{ matrix.id }}.deb"
                '
              ;;
            rpm)
              docker run --rm --platform '${{ matrix.platform }}' \
                -e VERSION="$version" \
                -v "$GITHUB_WORKSPACE:/src:ro" \
                -v "$out:/out" \
                '${{ matrix.image }}' bash -euxo pipefail -c '
                  dnf install -y cmake gcc-c++ make rpm-build findutils
                  cd /src
                  VERSION="$VERSION" packaging/rpm/build-rpm.sh "/out/tunnel-$VERSION-${{ matrix.id }}.rpm"
                '
              ;;
            arch)
              docker run --rm --platform '${{ matrix.platform }}' \
                -e VERSION="$version" \
                -v "$GITHUB_WORKSPACE:/src:ro" \
                -v "$out:/out" \
                '${{ matrix.image }}' bash -euxo pipefail -c '
                  pacman -Syu --noconfirm --needed base-devel cmake
                  cp -a /src /tmp/tunnel
                  cd /tmp/tunnel/packaging/arch
                  sed -i "s/^pkgver=.*/pkgver=$VERSION/" PKGBUILD
                  useradd -m builder
                  chown -R builder:builder /tmp/tunnel /out
                  su builder -c "cd /tmp/tunnel/packaging/arch && makepkg --noconfirm --syncdeps --nocheck --clean"
                  cp /tmp/tunnel/packaging/arch/tunnel-*.pkg.tar.zst /out/
                '
              ;;
            musl)
              docker run --rm --platform '${{ matrix.platform }}' \
                -e VERSION="$version" \
                -v "$GITHUB_WORKSPACE:/src:ro" \
                -v "$out:/out" \
                '${{ matrix.image }}' sh -euxo pipefail -c '
                  apk add --no-cache bash cmake g++ make musl-dev linux-headers
                  cd /src
                  VERSION="$VERSION" packaging/release/build-tarball.sh "/out/tunnel-$VERSION-${{ matrix.id }}-musl-static.tar.gz" musl-static
                '
              ;;
          esac

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.id }}
          path: ${{ runner.temp }}/release/*
          if-no-files-found: error
          retention-days: 7

  release:
    name: Publish GitHub Release
    needs: [build, portable]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download all release artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Build source archive and documentation asset
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          mkdir -p release-assets/source
          tar --exclude='.git' --exclude='./release-assets' -czf "release-assets/tunnel-$version-source.tar.gz" .
          find . -maxdepth 1 -type f -name '*-documentation.html' -exec cp {} release-assets/ \;

      - name: Generate SHA-256 checksums
        shell: bash
        run: |
          set -euo pipefail
          cd release-assets
          find . -type f ! -name SHA256SUMS.txt -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Validate release assets
        shell: bash
        run: |
          set -euo pipefail
          test -s release-assets/SHA256SUMS.txt
          find release-assets -type f -print | sort

      - name: Create/update GitHub Release
        shell: bash
        run: |
          set -euo pipefail
          tag="$GITHUB_REF_NAME"
          title="Tunnel $tag"

          if gh release view "$tag" >/dev/null 2>&1; then
            gh release edit "$tag" --title "$title"
          else
            gh release create "$tag" --title "$title" --generate-notes --verify-tag
          fi

          while IFS= read -r -d '' file; do
            gh release upload "$tag" "$file" --clobber
          done < <(find release-assets -type f -print0 | sort -z)
